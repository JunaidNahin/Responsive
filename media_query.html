<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <style>
        .food{
            border: 1px solid aquamarine;
            padding: 10px;
            border-radius: 5px;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 5px;
        }

        .food img{
            width: 100%;
        }

        @media screen and (min-width:576px) and (max-width:992px)  {
            .container{
                grid-template-columns: repeat(1,1fr);
            }

            .food{
                border: 1px solid navy;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="food">
            <img src="Images/HealthyFood.avif" alt="404 error">
            <h3>Salad</h3>
            <p>$10</p>
            <button>Order now</button>
        </div>

        <div class="food">
            <img src="Images/HealthyFood.avif" alt="404 error">
            <h3>Coleslaw salad</h3>
            <p>$15</p>
            <button>Order now</button>
        </div>

        <div class="food">
            <img src="Images/HealthyFood.avif" alt="404 error">
            <h3>Cashew nut Salad</h3>
            <p>$20</p>
            <button>Order now</button>
        </div>

        <div class="food">
            <img src="Images/HealthyFood.avif" alt="404 error">
            <h3>Baked Salad</h3>
            <p>$12</p>
            <button>Order now</button>
        </div>

        <div class="food">
            <img src="Images/HealthyFood.avif" alt="404 error">
            <h3>Raw Salad</h3>
            <p>$8</p>
            <button>Order now</button>
        </div>

        <div class="food">
            <img src="Images/HealthyFood.avif" alt="404 error">
            <h3>Pasta Salad</h3>
            <p>$17</p>
            <button>Order now</button>
        </div>
    </div>
</body>
</html>
