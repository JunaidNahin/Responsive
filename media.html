<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(2,1fr) ;
            gap: 20px;
        }
        .food{
            border: 1px solid green;
            padding: 20px;
            border-radius: 10px;
        }

        @media screen and (max-width: 768px) {
            .container{
                grid-template-columns: repeat(1,1fr) ;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="food">
            <img src="Images/HealthyFood.avif" alt="404 internal issue">
            <h4>Food-1</h4>
            <i>Price: $200</i>
            <p> Chef's special authentic and fresh food. </p>
        </div>

        <div class="food">
            <img src="Images/HealthyFood.avif" alt="404 internal issue">
            <h4>Food-2</h4>
            <i>Price: $150</i>
            <p> Owner's special authentic and fresh food. </p>
        </div>

        <div class="food">
            <img src="Images/HealthyFood.avif" alt="404 internal issue">
            <h4>Food-3</h4>
            <i>Price: $250</i>
            <p> Customer's choice special authentic and fresh food. </p>
        </div>

        <div class="food">
            <img src="Images/HealthyFood.avif" alt="404 internal issue">
            <h4>Food-4</h4>
            <i>Price: $250</i>
            <p> Traditional touch authentic and fresh food. </p>
        </div>
    </div>
</body>
</html>
